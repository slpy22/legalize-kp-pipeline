# 법령 주석 — 원천 텍스트는 고치지 않고 법령.md frontmatter 에 덧붙이는 정보.
# main.py 가 마스터목록 법령에 붙여 frontmatter 를 만들 때 넣는다.
#   law      : 법령명(마스터목록 name)
#   날짜이견 : 원문과 외부 자료의 날짜가 다를 때. 원문값을 유지하고 이견을 기록한다.
#     항목   : frontmatter 키(채택일·최신버전일) 또는 "개정이력 일자"
#     원문값 : 원문(국정원·법무부) 날짜, ISO. 판본 frontmatter 의 실제 값과 다르면 파이프라인이 중단한다
#     이견값 : 외부 자료의 날짜, ISO
#     출처   : 자료명·호수·doc_id
#     비고   : 선택
#   이력추가 : 원문을 확보하지 못한 제·개정·폐지. 법령의 최신 판본 frontmatter 개정이력에 일자 순으로 끼운다
#     일자     : ISO "YYYY-MM-DD" 또는 월만 알면 "YYYY-MM"(날짜를 지어내지 않는다)
#     내용     : 채택 / 수정보충 / 수정 / 폐지
#     외부근거 : 자료명·호수·doc_id (필수)
#     비고     : 선택(정령 번호 등)
#     → 개정이력 원소에 원문미확보: true 가 붙는다. 같은 일자 항목이 원문 이력에 이미 있으면 그 항목에 키만 더한다.
# 필드 계약은 legalize-kp-api(NKLAWSVC-T4 날짜이견, T7 이력추가)와 공유한다 — 키 이름을 바꾸면 그쪽 적재도 함께 바꿔야 한다.

